<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:image" content="https://airoasting.github.io/blog/assets/images/og-cover.png">
  <meta name="twitter:image" content="https://airoasting.github.io/blog/assets/images/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* ── Page Shell ── */
    body { margin: 0; overflow-x: hidden; }

    /* ── Controls Bar ── */
    .graph-controls {
      padding: 8px 0 10px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .graph-controls .ctrl-label {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      font-family: 'Pretendard', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 100px;
      border: 1.5px solid currentColor;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      background: transparent;
      font-family: 'Pretendard', sans-serif;
      opacity: 0.55;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-pill.active { opacity: 1; }
    .filter-pill:hover { opacity: 0.9; }
    .filter-pill .pill-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .ctrl-sep {
      width: 1px; height: 20px;
      background: rgba(255,255,255,0.15);
      margin: 0 2px;
      flex-shrink: 0;
    }
    .ctrl-stats {
      margin-left: auto;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-family: 'Pretendard', sans-serif;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ctrl-stats strong { color: rgba(255,255,255,0.75); font-weight: 600; }

    /* ── Page Layout: 헤더+컨트롤 아래 남은 영역을 캔버스가 정확히 채움 ── */
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    #site-header { flex-shrink: 0; }
    .graph-shell {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .graph-controls { flex-shrink: 0; }

    /* ── Canvas ── */
    .graph-canvas-wrap {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }
    #graphSvg {
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #graphSvg:active { cursor: grabbing; }

    /* 노드 탭 히트 영역 확장 */
    .g-node .hit-area {
      fill: transparent;
      stroke: none;
    }

    /* D3 elements */
    .g-link {
      fill: none;
      stroke-opacity: 0.06;
      transition: stroke-opacity 0.25s, stroke-width 0.2s;
    }
    .g-link.faded { stroke-opacity: 0.015; }
    .g-link.highlighted {
      stroke-opacity: 0.95;
      stroke-width: 2.4 !important;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.55));
    }

    .g-node { cursor: pointer; }
    .g-node circle {
      transition: fill-opacity 0.2s, filter 0.2s;
    }
    /* 고립 노드(연결 ≤1): 작고 반투명 */
    .g-node.isolated circle {
      fill-opacity: 0.25;
      stroke-opacity: 0.35;
    }
    /* 허브 노드(연결 상위 10%): 테두리 글로우 */
    .g-node.hub circle {
      stroke-width: 2.5;
      filter: drop-shadow(0 0 6px currentColor);
    }
    .g-node.faded circle { fill-opacity: 0.06; stroke-opacity: 0.15; }
    .g-node.faded text { opacity: 0.08; }
    .g-node.highlighted circle {
      stroke-width: 3;
      filter: drop-shadow(0 0 12px currentColor);
    }

    /* 육지 도트 (지도 배경) */
    .land-dot { pointer-events: none; }
    .land-dot.shimmer { animation: dotShimmer 7s ease-in-out infinite; }
    @keyframes dotShimmer {
      0%, 100% { fill-opacity: 0.3; }
      50%      { fill-opacity: 0.62; }
    }

    /* 허브 노드 숨쉬기 (글로우 강약) */
    .g-node.hub .node-dot { animation: hubPulse 3.4s ease-in-out infinite; }
    @keyframes hubPulse {
      0%, 100% { filter: drop-shadow(0 0 5px currentColor); }
      50%      { filter: drop-shadow(0 0 14px currentColor); }
    }
    /* 포커스 중에는 허브 펄스가 강조 효과를 덮지 않게 정지 */
    .g-node.faded .node-dot,
    .g-node.highlighted .node-dot { animation: none; }

    /* 유성(아크 위를 흐르는 빛) */
    .comet { pointer-events: none; }

    @media (prefers-reduced-motion: reduce) {
      .land-dot.shimmer, .g-node.hub .node-dot { animation: none; }
    }

    /* ── Zoom reset button (뉴모피즘) ── */
    .zoom-reset-btn {
      position: absolute;
      top: 20px;
      right: max(24px, calc(50% - 516px));
      background: #0E1628;
      border: none;
      border-radius: 10px;
      color: rgba(255,255,255,0.65);
      font-family: 'Pretendard', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 9px 16px;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow:
        -3px -3px 7px rgba(255,255,255,0.06),
         3px  3px 8px rgba(0,0,0,0.55),
        inset 0 0 0 1px rgba(255,255,255,0.04);
      transition: box-shadow 0.18s, color 0.18s;
    }
    .zoom-reset-btn:hover {
      color: #fff;
      box-shadow:
        -2px -2px 5px rgba(255,255,255,0.08),
         2px  2px 6px rgba(0,0,0,0.6),
        inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .zoom-reset-btn:active {
      box-shadow:
        inset -2px -2px 5px rgba(255,255,255,0.05),
        inset  2px  2px 6px rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.5);
    }

    .node-label {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
      font-weight: 600;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      user-select: none;
    }

    /* ── Tooltip Card ── */
    .graph-tooltip {
      position: fixed;
      top: 0; left: 0;
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      max-width: 300px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.28), 0 2px 8px rgba(0,0,0,0.12);
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s, transform 0.2s;
      font-family: 'Pretendard', sans-serif;
    }
    .graph-tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }
    /* 모바일: 하단 고정 패널 */
    @media (max-width: 768px) {
      .graph-tooltip {
        left: 0 !important;
        top: auto !important;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        border-radius: 20px 20px 0 0;
        padding: 20px 20px 32px;
        transform: translateY(100%);
        pointer-events: auto;
      }
      .graph-tooltip.show {
        transform: translateY(0);
      }
      /* 드래그 핸들 */
      .graph-tooltip::before {
        content: '';
        display: block;
        width: 36px; height: 4px;
        background: #E0E0E0;
        border-radius: 2px;
        margin: 0 auto 16px;
      }
    }
    .tt-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 100px;
      margin-bottom: 9px;
      color: #fff;
      letter-spacing: 0.03em;
    }
    .tt-title {
      font-size: 14px;
      font-weight: 700;
      color: #1A1A1A;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .tt-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
    .tt-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .tt-tag {
      font-size: 11px;
      background: #F2F0EB;
      color: #555;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .tt-connections {
      font-size: 12px;
      color: #666;
      border-top: 1px solid #F0F0F0;
      padding-top: 8px;
    }
    .tt-connections span { font-weight: 700; color: #333; }

    /* ── Loading State ── */
    .graph-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.5);
      font-family: 'Pretendard', sans-serif;
      font-size: 14px;
      gap: 16px;
    }
    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Page title row */
    .graph-page-header {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 24px 0;
      background: transparent;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .graph-page-title {
      font-family: 'Pretendard', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin: 0;
    }
    .graph-page-sub {
      font-family: 'Pretendard', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
    }

    /* Controls bar: 내부 콘텐츠만 컨테이너 정렬 */
    .graph-controls-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 4px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .graph-controls-inner::-webkit-scrollbar { display: none; }

    @media (max-width: 768px) {
      .graph-page-header { padding: 12px 16px 0; }
      .graph-page-title { font-size: 16px; }
      .graph-page-sub { font-size: 11px; }
      .zoom-reset-btn { top: 12px; right: 12px; padding: 7px 11px; font-size: 11px; }
      .graph-controls-inner { padding: 0 16px; }
    }
  </style>
</head>

/* ── Tooltip ── */
const tooltip = document.getElementById('graphTooltip');

function renderTooltipContent(node, degree) {
  const c = CAT[node.category] || CAT.research;
  const tags = (node.tags || []).slice(0, 5);
  const openBtn = node.url
    ? `<a href="${node.url}" target="${node.type === 'newsletter' ? '_blank' : '_self'}"
         style="display:inline-block;margin-top:10px;padding:7px 16px;background:${c.badge};color:#fff;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none;">
         아티클 열기 →</a>`
    : '';
  tooltip.innerHTML = `
    <div class="tt-badge" style="background:${c.badge};">${CAT_LABEL[node.category] || node.category}</div>
    <div class="tt-title">${node.title}</div>
    <div class="tt-meta">${node.date || ''} ${node.source ? '· ' + node.source : ''}</div>
    ${tags.length ? `<div class="tt-tags">${tags.map(t => `<span class="tt-tag">${t}</span>`).join('')}</div>` : ''}
    <div class="tt-connections">연결 아티클 <span>${degree}</span>개 · 가장 관련 깊은 ${Math.min(degree, 6)}개 강조</div>
    ${isMobile ? openBtn : ''}
  `;
}

function showTooltip(event, node, degree) {
  renderTooltipContent(node, degree);
  tooltip.classList.add('show');
  if (!isMobile) moveTooltip(event);
}

function moveTooltip(event) {
  if (isMobile) return;
  const pad = 16;
  const tw = tooltip.offsetWidth || 300;
  const th = tooltip.offsetHeight || 120;
  let x = event.clientX + pad;
  let y = event.clientY + pad;
  if (x + tw > window.innerWidth - pad) x = event.clientX - tw - pad;
  if (y + th > window.innerHeight - pad) y = event.clientY - th - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('show');
}

/* 모바일: 툴팁 외부 탭 시 닫기 (노드 탭은 click 핸들러에서 처리) */
if (isMobile) {
  tooltip.style.pointerEvents = 'auto';
  document.addEventListener('touchstart', e => {
    const isSvgNode = e.target.closest('circle, .node, [data-node]') ||
                      e.target.tagName === 'circle' ||
                      e.target.closest('svg');
    if (!tooltip.contains(e.target) && !isSvgNode) hideTooltip();
  }, { passive: true });
}

/* ── Main ── */
fetch('../posts-index.json')
  .then(r => r.json())
  .then(data => buildGraph(data.posts || []))
  .catch(err => {
    document.getElementById('graphLoading').innerHTML =
      '<div style="color:#F87171;font-size:14px;">데이터 로드 실패: ' + err.message + '</div>';
  });

function buildGraph(posts) {
  /* 1. Nodes */
  const nodes = [];

  posts.forEach(p => {
    nodes.push({
      id: p.slug || p.file,
      title: p.title,
      category: p.category || 'research',
      tags: p.tags || [],
      date: p.date,
      source: p.source || '',
      url: '../' + p.file,
      type: 'post',
      summary: p.summary || ''
    });
  });

  const newsletters = window.NEWSLETTER_DATA || [];
  newsletters.forEach(n => {
    nodes.push({
      id: 'nl-' + n.ep,
      title: 'NL #' + n.ep + ' ' + n.title,
      category: 'newsletter',
      tags: NL_TAGS[String(n.ep)] || [],
      date: n.date,
      source: 'AI ROASTING 뉴스레터',
      url: n.url,
      type: 'newsletter',
      ep: n.ep
    });
  });

  const nodeById = new Map(nodes.map(n => [n.id, n]));

  /* 2. Edges: 공유 태그 기반 (너무 흔한 태그는 제외) */
  const tagMap = {};
  nodes.forEach(n => {
    (n.tags || []).forEach(tag => {
      if (!tagMap[tag]) tagMap[tag] = [];
      tagMap[tag].push(n.id);
    });
  });

  /* 너무 범용적인 태그는 연결선 생성에서 제외 (의미 있는 연결만 남김) */
  const GENERIC_TAGS = new Set(['AI전략','규제','AI에이전트','스타트업','일자리','AI','데이터','조직설계','Anthropic','OpenAI','Claude','ChatGPT','Google','Meta']);
  const edgeWeights = {};
  Object.entries(tagMap).forEach(([tag, ids]) => {
    if (GENERIC_TAGS.has(tag)) return; // 너무 범용적인 태그 스킵
    if (ids.length > 60) return;       // 60개 이상 노드에 등장하는 태그도 제외
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const key = [ids[i], ids[j]].sort().join('\x00');
        edgeWeights[key] = (edgeWeights[key] || 0) + 1;
      }
    }
  });

  /* 최소 1개 이상 공유 태그인 엣지만 사용 */
  const links = Object.entries(edgeWeights)
    .filter(([, w]) => w >= 1)
    .map(([key, weight]) => {
      const [source, target] = key.split('\x00');
      return { source, target, weight };
    });

  /* 3. Degree map */
  const degreeMap = {};
  links.forEach(l => {
    degreeMap[l.source] = (degreeMap[l.source] || 0) + 1;
    degreeMap[l.target] = (degreeMap[l.target] || 0) + 1;
  });
  nodes.forEach(n => { n.degree = degreeMap[n.id] || 0; });

  /* Node radius: sqrt scale */
  const maxDeg = d3.max(nodes, n => n.degree) || 1;
  const rMin = isMobile ? 4.5 : 3.5;
  const rMax = isMobile ? 12 : 9.5;
  const rScale = d3.scaleSqrt().domain([0, maxDeg]).range([rMin, rMax]);
  nodes.forEach(n => { n.r = rScale(n.degree); });

  /* 허브 임계값: 상위 10% */
  const hubThreshold = d3.quantile(nodes.map(n => n.degree).sort(d3.ascending), 0.9);

  /* 4. Stats */
  document.getElementById('graphStats').innerHTML =
    '노드 <strong>' + nodes.length + '</strong>개 &nbsp;·&nbsp; 연결선 <strong>' + links.length + '</strong>개';

  /* 5. D3 setup */
  const svg = d3.select('#graphSvg');
  const wrap = document.querySelector('.graph-canvas-wrap');
  let W = wrap.clientWidth;
  let H = wrap.clientHeight;

  const g = svg.append('g');

  /* Zoom: 드래그 팬 + 휠/핀치 줌 */
  const zoom = d3.zoom()
    .scaleExtent([0.6, 8])
    .on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom).on('dblclick.zoom', null);

  /* ── 지도 투영 (Natural Earth, 태평양 중심: 아메리카가 오른쪽) ──
     경도 155°E를 중앙에 두면 유럽·아프리카가 왼쪽, 아시아가 중앙,
     아메리카 대륙이 오른쪽에 놓인다. 절단선은 대서양(25°W)을 지난다. */
  const landFeature = { type: 'MultiPoint', coordinates: LAND_DOTS };
  const projection = d3.geoNaturalEarth1().rotate([-155, 0]);

  function fitProjection() {
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    const pad = isMobile ? 12 : 36;
    projection.fitExtent([[pad, pad + 8], [W - pad, H - pad]], landFeature);
  }
  fitProjection();

  /* 안정적 hash → 0~1 의사난수 */
  function hashRand(id) {
    let h = 2166136261 | 0;
    const s = id || '';
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i); h = Math.imul(h, 16777619);
    }
    return ((h >>> 0) % 10000) / 10000;
  }

  /* ── 육지 도트 렌더 (중립 톤, 밤바다 위 육지 실루엣) ── */
  const dotData = LAND_DOTS.map(([lon, lat]) => ({ lon, lat }));

  const landG = g.append('g').attr('class', 'land-group');
  const dotSel = landG.selectAll('circle').data(dotData).join('circle')
    .attr('class', 'land-dot')
    .attr('r', isMobile ? 1.2 : 1.7)
    .attr('fill', '#8FB6E8')
    .attr('fill-opacity', 0.3);

  /* 은은한 반짝임: 일부 도트만 도시 불빛처럼 깜박임 */
  dotSel.filter((d, i) => i % 13 === 0)
    .classed('shimmer', true)
    .style('animation-delay', d => (-(hashRand(d.lon + ',' + d.lat) * 7)).toFixed(2) + 's');

  /* ── 노드 배치: 전 세계 육지 도트 위에 카테고리를 고르게 섞어 배치 ──
     1) 카테고리별로 연결 많은 순 정렬 후 라운드로빈으로 섞은 순서를 만들고
     2) farthest-point 샘플링으로 이미 놓인 노드와 가장 먼 도트를 차례로 고른다.
     연속 배치되는 노드는 서로 다른 카테고리이므로,
     어느 지역을 봐도 여러 색이 섞이고 같은 색끼리는 지도 전체에 흩어진다. */
  const candidates = dotData.map(d => {
    const [x, y] = projection([d.lon, d.lat]);
    return { d, x, y };
  });

  const byCat = {};
  nodes.forEach(n => { (byCat[n.category] = byCat[n.category] || []).push(n); });
  Object.values(byCat).forEach(list =>
    list.sort((a, b) => (b.degree - a.degree) || (hashRand(a.id) - hashRand(b.id))));
  const catKeys = Object.keys(byCat);
  const placeOrder = [];
  for (let i = 0; placeOrder.length < nodes.length; i++) {
    catKeys.forEach(k => { if (byCat[k][i]) placeOrder.push(byCat[k][i]); });
  }

  /* farthest-point: minDist 배열 유지로 O(노드 수 × 도트 수) */
  const minDist = new Float64Array(candidates.length).fill(Infinity);
  const used = new Uint8Array(candidates.length);
  const cxm = d3.mean(candidates, c => c.x);
  const cym = d3.mean(candidates, c => c.y);

  placeOrder.forEach((n, idx) => {
    let best = -1, bestScore = -Infinity;
    for (let i = 0; i < candidates.length; i++) {
      if (used[i]) continue;
      /* 첫 노드(최대 허브)는 지도 무게중심 근처, 이후는 기존 배치와 최대한 멀리 */
      const score = idx === 0
        ? -((candidates[i].x - cxm) ** 2 + (candidates[i].y - cym) ** 2)
        : minDist[i];
      if (score > bestScore) { bestScore = score; best = i; }
    }
    if (best < 0) return;
    used[best] = 1;
    const c = candidates[best];
    n.geo = [c.d.lon, c.d.lat];
    for (let i = 0; i < candidates.length; i++) {
      if (used[i]) continue;
      const dd = (candidates[i].x - c.x) ** 2 + (candidates[i].y - c.y) ** 2;
      if (dd < minDist[i]) minDist[i] = dd;
    }
  });

  /* 화면 좌표 계산 */
  function positionNodes() {
    nodes.forEach(n => {
      if (!n.geo) { n.x = -9999; n.y = -9999; return; }
      const [x, y] = projection(n.geo);
      n.x = x; n.y = y;
    });
  }
  positionNodes();

  /* 6. Render links: 항공 노선 느낌의 곡선 아크 */
  const linkG = g.append('g').attr('class', 'links-group');
  const linkSel = linkG.selectAll('path')
    .data(links)
    .join('path')
    .attr('class', 'g-link')
    .attr('stroke', d => {
      const src = nodeById.get(typeof d.source === 'string' ? d.source : d.source.id);
      return src ? CAT[src.category].stroke : '#fff';
    })
    .attr('stroke-width', d => Math.min(2.4, 0.7 + (d.weight || 1) * 0.35));

  function linkArc(d) {
    const s = nodeById.get(typeof d.source === 'string' ? d.source : d.source.id);
    const t = nodeById.get(typeof d.target === 'string' ? d.target : d.target.id);
    if (!s || !t) return '';
    const dx = t.x - s.x, dy = t.y - s.y;
    const dist = Math.hypot(dx, dy) || 1;
    /* 중점에서 수직 방향으로 살짝 부풀린 곡선 */
    const mx = (s.x + t.x) / 2 - dy * 0.14;
    const my = (s.y + t.y) / 2 + dx * 0.14;
    return `M${s.x},${s.y}Q${mx},${my} ${t.x},${t.y}`;
  }

  function updateLinkPaths() { linkSel.attr('d', linkArc); }

  /* 7. Render nodes */
  const nodeG = g.append('g').attr('class', 'nodes-group');
  const nodeSel = nodeG.selectAll('g.g-node')
    .data(nodes)
    .join('g')
    .attr('class', 'g-node');

  /* 고립/허브 클래스 + currentColor(펄스 글로우 색) */
  nodeSel.classed('isolated', d => d.degree <= 1);
  nodeSel.classed('hub', d => d.degree >= hubThreshold && d.degree > 2);
  nodeSel.style('color', d => CAT[d.category].stroke);
  /* 허브 펄스 위상 분산 */
  nodeSel.filter('.hub').style('animation-delay', d => (-(hashRand(d.id) * 3.4)).toFixed(2) + 's');

  /* 히트 영역 확장 (탭/클릭 정확도 향상) */
  nodeSel.append('circle')
    .attr('class', 'hit-area')
    .attr('r', d => d.r + (isMobile ? 12 : 6));

  /* Circle — 도시의 불빛처럼 채워진 형태 + 외곽 빛 */
  nodeSel.append('circle')
    .attr('class', 'node-dot')
    .attr('r', d => d.r)
    .attr('fill', d => CAT[d.category].stroke)
    .attr('fill-opacity', 0.85)
    .attr('stroke', d => CAT[d.category].stroke)
    .attr('stroke-width', d => d.degree >= hubThreshold ? 1.5 : 0.8)
    .attr('stroke-opacity', 0.9)
    .style('filter', d => d.degree >= hubThreshold
      ? `drop-shadow(0 0 6px ${CAT[d.category].stroke})`
      : `drop-shadow(0 0 3px ${CAT[d.category].stroke})`);

  /* Label: 기본 숨김, 클릭 시 표시 */
  nodeSel.each(function(d) {
    const el = d3.select(this);
    const words = d.title.split(/\s+/);
    const maxChars = 10;
    let line1 = '', line2 = '';
    for (const w of words) {
      if (!line1) { line1 = w; }
      else if ((line1 + ' ' + w).length <= maxChars) { line1 += ' ' + w; }
      else if (!line2) { line2 = w; }
      else if ((line2 + ' ' + w).length <= maxChars) { line2 += ' ' + w; }
      else break;
    }
    const fs = 9;
    if (line2) {
      el.append('text').attr('class', 'node-label').attr('y', -5).attr('font-size', fs).text(line1);
      el.append('text').attr('class', 'node-label').attr('y', +6).attr('font-size', fs).text(line2.length > maxChars ? line2.slice(0, maxChars-1)+'…' : line2);
    } else {
      el.append('text').attr('class', 'node-label').attr('font-size', fs).text(line1.length > maxChars ? line1.slice(0,maxChars-1)+'…' : line1);
    }
    /* 기본적으로 숨김 */
    el.selectAll('text').style('display', 'none');
  });

  /* ── 전체 위치 반영 (도트/라벨/링크/노드) ── */
  function renderPositions() {
    dotSel.each(function(d) {
      const [x, y] = projection([d.lon, d.lat]);
      this.setAttribute('cx', x);
      this.setAttribute('cy', y);
    });
    positionNodes();
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    updateLinkPaths();
  }
  renderPositions();

  /* ── 등장 애니메이션: 왼쪽에서 오른쪽으로 노드가 퍼지는 웨이브 ── */
  const reduceMotion = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduceMotion) {
    landG.attr('opacity', 0)
      .transition().duration(900).attr('opacity', 1);
    linkG.attr('opacity', 0)
      .transition().delay(1400).duration(900).attr('opacity', 1);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y}) scale(0)`)
      .transition('enter')
      .duration(650)
      .delay(d => 250 + (d.x / Math.max(1, W)) * 1100 + hashRand(d.id) * 250)
      .ease(d3.easeBackOut)
      .attr('transform', d => `translate(${d.x},${d.y}) scale(1)`);
  }

  /* ── 유성: 무작위 아크를 따라 빛이 흘러가는 효과 ── */
  const linkEls = linkSel.nodes();
  function spawnComet() {
    if (reduceMotion || !linkEls.length || document.hidden) return;
    const el = linkEls[Math.floor(Math.random() * linkEls.length)];
    if (el.style.display === 'none' || el.classList.contains('faded')) return;
    const ld = d3.select(el).datum();
    const src = nodeById.get(typeof ld.source === 'string' ? ld.source : ld.source.id);
    const color = src ? CAT[src.category].stroke : '#fff';
    const L = el.getTotalLength();
    if (!L) return;
    const comet = g.append('circle')
      .attr('class', 'comet')
      .attr('r', isMobile ? 1.6 : 2)
      .attr('fill', color)
      .attr('opacity', 0.95)
      .style('filter', `drop-shadow(0 0 5px ${color})`);
    comet.transition()
      .duration(1500 + Math.random() * 1300)
      .ease(d3.easeQuadInOut)
      .attrTween('cx', () => t => el.getPointAtLength(t * L).x)
      .attrTween('cy', () => t => el.getPointAtLength(t * L).y)
      .on('end', () => comet.remove())
      .on('interrupt', () => comet.remove());
  }
  if (!reduceMotion) setTimeout(() => setInterval(spawnComet, 420), 2200);

  /* 8. Interaction state */
  let selectedNode = null;   // 클릭으로 선택된 노드

  /* 호버한 노드에서 가장 관련 깊은 상위 N개 엣지만 강조 */
  const TOP_RELATED = 6;

  function getTopRelated(d) {
    const my = [];
    links.forEach(l => {
      const sid = typeof l.source === 'string' ? l.source : l.source.id;
      const tid = typeof l.target === 'string' ? l.target : l.target.id;
      if (sid === d.id || tid === d.id) my.push(l);
    });
    /* 가중치(공유 태그 수) 내림차순, 동률은 weight·degree 가중 */
    my.sort((a, b) => {
      const wa = (a.weight || 0), wb = (b.weight || 0);
      if (wb !== wa) return wb - wa;
      const aOther = ((typeof a.source === 'string' ? a.source : a.source.id) === d.id)
        ? (typeof a.target === 'string' ? a.target : a.target.id)
        : (typeof a.source === 'string' ? a.source : a.source.id);
      const bOther = ((typeof b.source === 'string' ? b.source : b.source.id) === d.id)
        ? (typeof b.target === 'string' ? b.target : b.target.id)
        : (typeof b.source === 'string' ? b.source : b.source.id);
      const aN = nodeById.get(aOther), bN = nodeById.get(bOther);
      return ((bN && bN.degree) || 0) - ((aN && aN.degree) || 0);
    });
    const top = my.slice(0, TOP_RELATED);
    const topSet = new Set(top);
    const neighborSet = new Set([d.id]);
    top.forEach(l => {
      const sid = typeof l.source === 'string' ? l.source : l.source.id;
      const tid = typeof l.target === 'string' ? l.target : l.target.id;
      neighborSet.add(sid);
      neighborSet.add(tid);
    });
    return { topSet, neighborSet };
  }

  function applyFocus(d) {
    const { topSet, neighborSet } = getTopRelated(d);
    nodeSel.classed('faded', n => !neighborSet.has(n.id));
    nodeSel.classed('highlighted', n => n.id === d.id);
    linkSel
      .classed('faded', l => !topSet.has(l))
      .classed('highlighted', l => topSet.has(l));
    /* 강조 아크: 출발점에서 그려지는 드로잉 효과 */
    linkSel.interrupt('draw')
      .attr('stroke-dasharray', null)
      .attr('stroke-dashoffset', null);
    if (!reduceMotion) {
      linkSel.filter(l => topSet.has(l)).each(function() {
        const L = this.getTotalLength();
        d3.select(this)
          .attr('stroke-dasharray', L + ' ' + L)
          .attr('stroke-dashoffset', L)
          .transition('draw').duration(550).ease(d3.easeCubicOut)
          .attr('stroke-dashoffset', 0)
          .on('end', function() {
            d3.select(this)
              .attr('stroke-dasharray', null)
              .attr('stroke-dashoffset', null);
          });
      });
    }
    /* 관련 노드에만 레이블 표시 */
    nodeSel.selectAll('text').style('display', function() {
      const nd = d3.select(this.parentNode).datum();
      return neighborSet.has(nd.id) ? null : 'none';
    });
  }

  function clearFocus() {
    selectedNode = null;
    nodeSel.classed('faded', false).classed('highlighted', false);
    linkSel.classed('faded', false).classed('highlighted', false)
      .interrupt('draw')
      .attr('stroke-dasharray', null)
      .attr('stroke-dashoffset', null);
    /* 모든 레이블 숨김 */
    nodeSel.selectAll('text').style('display', 'none');
  }

  /* Hover: 포커스/툴팁 */
  if (!isMobile) {
    nodeSel
      .on('mouseenter', function(event, d) {
        if (!selectedNode) applyFocus(d);
        showTooltip(event, d, d.degree);
      })
      .on('mousemove', moveTooltip)
      .on('mouseleave', function() {
        if (!selectedNode) clearFocus();
        hideTooltip();
      });
  }

  /* Single click: lock focus on this node (연결 노드만 표시) */
  nodeSel.on('click', function(event, d) {
    event.stopPropagation();
    if (selectedNode && selectedNode.id === d.id) {
      clearFocus();   // 같은 노드 다시 클릭 → 해제
      if (isMobile) hideTooltip();
    } else {
      selectedNode = d;
      applyFocus(d);
      if (isMobile) showTooltip(event, d, d.degree);
    }
  });

  /* Double click: navigate to article */
  nodeSel.on('dblclick', function(event, d) {
    event.stopPropagation();
    if (d.url) window.open(d.url, d.type === 'newsletter' ? '_blank' : '_self');
  });

  /* Click on empty canvas → clear focus */
  svg.on('click', function() {
    clearFocus();
    hideTooltip();
  });

  /* Fit to view — 줌 리셋 */
  function fitToView(animate = true) {
    const t = d3.zoomIdentity;
    if (animate) {
      svg.transition().duration(600).call(zoom.transform, t);
    } else {
      svg.call(zoom.transform, t);
    }
    const loadingEl = document.getElementById('graphLoading');
    if (loadingEl) loadingEl.style.display = 'none';
  }

  fitToView(false);

  /* 창 리사이즈: 투영 재계산 + 전체 재배치 */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      fitProjection();
      renderPositions();
      fitToView(false);
    }, 150);
  });

  /* Zoom reset button */
  document.getElementById('zoomResetBtn').addEventListener('click', () => fitToView(true));

  /* 10. Category filter */
  let activeCategories = new Set(['research','leader','company','tech','survival','column','newsletter']);

  document.getElementById('graphControls').addEventListener('click', e => {
    const btn = e.target.closest('.filter-pill');
    if (!btn) return;
    const cat = btn.dataset.cat;

    if (cat === 'all') {
      if (activeCategories.size === 6) {
        activeCategories.clear();
        document.querySelectorAll('.filter-pill:not([data-cat="all"])').forEach(b => b.classList.remove('active'));
      } else {
        activeCategories = new Set(['research','leader','company','tech','survival','column','newsletter']);
        document.querySelectorAll('.filter-pill:not([data-cat="all"])').forEach(b => b.classList.add('active'));
      }
      btn.classList.toggle('active', activeCategories.size > 0);
    } else {
      if (activeCategories.has(cat)) {
        activeCategories.delete(cat);
        btn.classList.remove('active');
      } else {
        activeCategories.add(cat);
        btn.classList.add('active');
      }
      document.querySelector('[data-cat="all"]').classList.toggle('active', activeCategories.size === 6);
    }

    nodeSel.style('display', d => activeCategories.has(d.category) ? null : 'none');
    linkSel.style('display', l => {
      const sid = typeof l.source === 'string' ? l.source : l.source.id;
      const tid = typeof l.target === 'string' ? l.target : l.target.id;
      const sn = nodeById.get(sid);
      const tn = nodeById.get(tid);
      return (sn && activeCategories.has(sn.category)) && (tn && activeCategories.has(tn.category)) ? null : 'none';
    });
  });

}

})();
</script>
</body>
</html>
