<!-- 소스 이미지/인포그래픽 포함 템플릿. 파일 다운로드 없이 원본 URL 그대로 사용 -->
<figure class="post-figure" style="margin: 28px 0;">
  <img src="{원본 이미지 URL}" alt="{이미지 내용 한국어 설명}" style="width:100%; border-radius:8px; display:block;"
       onerror="this.parentElement.style.display='none'">
  <figcaption style="font-size:13px; color:#888; margin-top:8px; line-height:1.6;">
    {원문 캡션 번역} ({경영 리더 관점 시사점 한 문장})
    <span style="display:block; margin-top:4px; font-size:12px;">출처: {저자/매체} ({연도})</span>
  </figcaption>
</figure>

<!-- 포함 기준: 논문 Figure, 데이터 시각화, 비교/설명 스크린샷 -->
<!-- 제외: 장식 배너, 저자 프로필, UI 요소 -->
